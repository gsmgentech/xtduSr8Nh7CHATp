<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ML Matchmaking</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="deck" id="deck">

<img
src="image/card.png"
alt=""
class="deck-image"
>

</div>

<div class="container">

<div class="layout">

<div class="sidebar" id="sidebar">

<div class="title-row">

<div class="title">
ML Matchmaking
</div>

<div class="counter" id="playerCount">
0 Players
</div>

</div>

<div class="input-group">

<input
type="text"
id="playerInput"
placeholder="Enter player name..."
>

<button class="add-btn" id="addPlayerBtn">
Add
</button>

</div>

<div class="players" id="playersList"></div>

<button class="action-btn start-btn" id="startBtn">
⚔ START MATCHMAKING
</button>

</div>

<div class="main" id="main">

<div class="top-controls">

<button class="action-btn random-btn" id="rerandomBtn">
🎲 RE-RANDOMIZE
</button>

<button class="action-btn reset-btn" id="backBtn">
⬅ BACK
</button>

</div>

<div class="teams">

<div class="team">

<div class="team-header">

<div class="team-title">
🔥 Team A
</div>

<div class="team-count">
5 Players
</div>

</div>

<div class="team-list" id="teamA"></div>

</div>

<div class="team">

<div class="team-header">

<div class="team-title">
⚡ Team B
</div>

<div class="team-count">
5 Players
</div>

</div>

<div class="team-list" id="teamB"></div>

</div>

</div>

<div class="waiting" id="waitingBox">

<div class="waiting-title">
🪑 Waiting Lobby / Next Match
</div>

<div class="waiting-list" id="waitingList"></div>

</div>

<button class="action-btn reset-btn bottom-reset" id="resetBtn">
RESET
</button>

</div>

</div>

</div>

<script src="js/script.js"></script>

</body>
</html>
